<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쇼핑 리스트</title>
<style>
  :root {
    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #1d1d1f;
    --sub: #6e6e73;
    --accent: #007aff;
    --danger: #ff3b30;
    --border: #e5e5ea;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }
  .app {
    width: 100%;
    max-width: 420px;
  }
  h1 {
    font-size: 24px;
    margin: 0 0 20px;
    text-align: center;
  }
  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  #item-input {
    flex: 1;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 15px;
    outline: none;
    background: var(--card);
  }
  #item-input:focus {
    border-color: var(--accent);
  }
  #add-btn {
    padding: 12px 18px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  #add-btn:hover { opacity: 0.9; }

  .summary {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    font-size: 13px;
    color: var(--sub);
  }
  #clear-checked {
    background: none;
    border: none;
    color: var(--danger);
    font-size: 13px;
    cursor: pointer;
    padding: 0;
  }

  ul#list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  li.item {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--card);
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
  }
  li.item .checkbox {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid var(--border);
    flex-shrink: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, border-color 0.15s;
  }
  li.item.checked .checkbox {
    background: var(--accent);
    border-color: var(--accent);
  }
  li.item .checkbox svg {
    width: 12px;
    height: 12px;
    display: none;
  }
  li.item.checked .checkbox svg { display: block; }

  li.item .label {
    flex: 1;
    font-size: 15px;
    word-break: break-word;
    cursor: pointer;
  }
  li.item.checked .label {
    text-decoration: line-through;
    color: var(--sub);
  }
  li.item .delete-btn {
    background: none;
    border: none;
    color: var(--sub);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    padding: 4px;
  }
  li.item .delete-btn:hover { color: var(--danger); }

  .empty {
    text-align: center;
    color: var(--sub);
    font-size: 14px;
    padding: 40px 0;
  }
</style>
</head>
<body>
<div class="app">
  <h1>🛒 쇼핑 리스트</h1>

  <div class="input-row">
    <input id="item-input" type="text" placeholder="아이템 입력 후 Enter" maxlength="60" autofocus>
    <button id="add-btn">추가</button>
  </div>

  <div class="summary">
    <span id="count-text">0개 항목</span>
    <button id="clear-checked">체크된 항목 삭제</button>
  </div>

  <ul id="list"></ul>
  <div id="empty-msg" class="empty" style="display:none;">아직 담긴 아이템이 없어요</div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://latsgcvvedrjweheiggd.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_LCUOCVoIqi19KtJIot_7Yw_J3oRZ-Ou';
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/** @type {{id:string, text:string, checked:boolean}[]} */
let items = [];

const listEl = document.getElementById('list');
const inputEl = document.getElementById('item-input');
const addBtn = document.getElementById('add-btn');
const countText = document.getElementById('count-text');
const clearCheckedBtn = document.getElementById('clear-checked');
const emptyMsg = document.getElementById('empty-msg');

async function load() {
  const { data, error } = await supabase
    .from('shopping_items')
    .select('id, text, checked')
    .order('created_at', { ascending: true });
  if (error) {
    console.error('불러오기 실패:', error.message);
    items = [];
    return;
  }
  items = data;
}

async function addItem(text) {
  const trimmed = text.trim();
  if (!trimmed) return;
  const { data, error } = await supabase
    .from('shopping_items')
    .insert({ text: trimmed, checked: false })
    .select('id, text, checked')
    .single();
  if (error) {
    console.error('추가 실패:', error.message);
    return;
  }
  items.push(data);
  render();
}

async function deleteItem(id) {
  const { error } = await supabase.from('shopping_items').delete().eq('id', id);
  if (error) {
    console.error('삭제 실패:', error.message);
    return;
  }
  items = items.filter(i => i.id !== id);
  render();
}

async function toggleItem(id) {
  const item = items.find(i => i.id === id);
  if (!item) return;
  const checked = !item.checked;
  const { error } = await supabase.from('shopping_items').update({ checked }).eq('id', id);
  if (error) {
    console.error('업데이트 실패:', error.message);
    return;
  }
  item.checked = checked;
  render();
}

async function clearChecked() {
  const checkedIds = items.filter(i => i.checked).map(i => i.id);
  if (checkedIds.length === 0) return;
  const { error } = await supabase.from('shopping_items').delete().in('id', checkedIds);
  if (error) {
    console.error('삭제 실패:', error.message);
    return;
  }
  items = items.filter(i => !i.checked);
  render();
}

function render() {
  listEl.innerHTML = '';
  emptyMsg.style.display = items.length === 0 ? 'block' : 'none';

  for (const item of items) {
    const li = document.createElement('li');
    li.className = 'item' + (item.checked ? ' checked' : '');

    const checkbox = document.createElement('div');
    checkbox.className = 'checkbox';
    checkbox.innerHTML = '<svg viewBox="0 0 16 16" fill="none"><path d="M3 8l3.5 3.5L13 4.5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    checkbox.addEventListener('click', () => toggleItem(item.id));

    const label = document.createElement('span');
    label.className = 'label';
    label.textContent = item.text;
    label.addEventListener('click', () => toggleItem(item.id));

    const delBtn = document.createElement('button');
    delBtn.className = 'delete-btn';
    delBtn.textContent = '✕';
    delBtn.addEventListener('click', () => deleteItem(item.id));

    li.appendChild(checkbox);
    li.appendChild(label);
    li.appendChild(delBtn);
    listEl.appendChild(li);
  }

  const checkedCount = items.filter(i => i.checked).length;
  countText.textContent = `${items.length}개 항목 (${checkedCount}개 완료)`;
}

addBtn.addEventListener('click', () => {
  const value = inputEl.value;
  inputEl.value = '';
  inputEl.focus();
  addItem(value);
});

inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const value = inputEl.value;
    inputEl.value = '';
    addItem(value);
  }
});

clearCheckedBtn.addEventListener('click', clearChecked);

(async function init() {
  await load();
  render();
})();
</script>
</body>
</html>
